<!-- gone-done:web-app (вставляется scripts/build_web.py; руками в public/index.html не правьте) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gone Done">
<meta name="application-name" content="Gone Done">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* страница приклеена к экрану: ни прокрутки, ни «резинки», ни выделения текста, ни меню по долгому нажатию */
html, body {
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	width: 100%; height: 100%;
	margin: 0; padding: 0;
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	background: #000;
	-webkit-touch-callout: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}
#canvas { touch-action: none; }
</style>
<script>
// Safari на iPhone игнорирует user-scalable=no и двигает страницу пальцем — гасим сами.
(function () {
	var opts = { passive: false };
	var stop = function (e) { e.preventDefault(); };
	['touchmove', 'gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
		document.addEventListener(name, stop, opts);
	});
	document.addEventListener('contextmenu', stop);
	document.addEventListener('selectstart', stop);
	// сброс возможного сдвига страницы при повороте экрана и показе/скрытии адресной строки
	window.addEventListener('orientationchange', function () { setTimeout(function () { window.scrollTo(0, 0); }, 300); });
	window.addEventListener('scroll', function () { window.scrollTo(0, 0); });
})();
</script>
